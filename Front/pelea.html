<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Batalla Pokémon</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background: #7e0707;
    color:white;
    text-align:center;
}



.screen{
    display:none;
    padding:30px;
}

.screen.active{
    display:block;
}



.inputs{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin:30px;
}

input{
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:none;
    width:200px;
}

button{
    padding:12px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#131116;
    color:#eff1f2;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}


.arena{
    display:flex;
    justify-content:space-around;
    align-items:center;
    margin-top:40px;
}


.pokemon-card{
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius:15px;
    padding:20px;
    width:220px;
}

.pokemon-card img{
    width:120px;
}


.hp-bar-container{
    background:#444;
    border-radius:10px;
    overflow:hidden;
    height:15px;
    margin-top:10px;
}

.hp-bar{
    background:#2ecc71;
    height:100%;
    width:100%;
    transition:width 0.5s;
}



#narrator-box{
    background:rgba(0,0,0,0.3);
    padding:20px;
    border-radius:15px;
    width:250px;
}



#battle-log{
    margin-top:40px;
    background:rgba(0,0,0,0.25);
    padding:20px;
    border-radius:15px;
    width:400px;
    margin-left:auto;
    margin-right:auto;
}

#log-list{
    text-align:left;
}


#winner-screen img{
    width:180px;
    margin-top:20px;
}

</style>
</head>

<body>

<datalist id="pokemon-list"></datalist>

<div id="selection-screen" class="screen active">
<h1>Elige a tu Pokemon</h1>

<div class="inputs">
<input type="text" id="poke1-input" list="pokemon-list" placeholder="Pokémon 1 (ej. pikachu)">
<p>VS</p>
<input type="text" id="poke2-input" list="pokemon-list" placeholder="Pokémon 2 (ej. charizard)">
</div>

<button onclick="iniciarBatalla()">Comenzar la pelea !!</button>
<p id="error-msg" style="color:red;"></p>
</div>


<div id="battle-screen" class="screen">

<h2>Simulación en curso...</h2>

<div class="arena">

<div class="pokemon-card" id="card-p1">
<h3 id="p1-name">Pokémon 1</h3>
<img id="p1-img" src="">
<div class="hp-bar-container">
<div id="p1-hp-bar" class="hp-bar"></div>
</div>
<p>HP: <span id="p1-hp-text">100</span>%</p>
</div>

<div id="narrator-box">
<h3 id="narrator-text">¡Preparando el combate!</h3>
</div>

<div class="pokemon-card" id="card-p2">
<h3 id="p2-name">Pokémon 2</h3>
<img id="p2-img" src="">
<div class="hp-bar-container">
<div id="p2-hp-bar" class="hp-bar"></div>
</div>
<p>HP: <span id="p2-hp-text">100</span>%</p>
</div>

</div>


<div id="battle-log">
<h3>Historial de Movimientos</h3>
<ul id="log-list"></ul>
</div>

</div>


<div id="winner-screen" class="screen">

<h1>Ganador !!</h1>
<h2 id="winner-name">---</h2>
<img id="winner-img" src="">



<br><br>
<button onclick="location.reload()">Simular otra batalla</button>
</div>

<a href="main.html">
<button class="add-btn">Back</button>
</a>


<script src="pelea.js"></script>

</body>
</html>
